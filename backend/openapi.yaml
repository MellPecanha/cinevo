openapi: 3.1.0
info:
  title: Cinevo API
  version: 1.0.0
  description: API para catálogo, reservas, ingressos e administração de cinemas.
servers:
  - url: http://localhost:3334
paths:
  /health:
    get:
      summary: Verifica a disponibilidade da API
      responses:
        '200':
          description: API disponível
  /movies:
    get:
      summary: Lista filmes do catálogo público
      responses:
        '200':
          description: Filmes cadastrados
    post:
      summary: Cadastra um filme
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Filme criado }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cinemas:
    get:
      summary: Lista cinemas públicos
      responses:
        '200': { description: Cinemas cadastrados }
    post:
      summary: Cadastra um cinema
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Cinema criado }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sessions:
    get:
      summary: Lista sessões públicas
      responses:
        '200': { description: Sessões com filme e sala }
    post:
      summary: Cria uma sessão
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201': { description: Sessão criada }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rooms:
    get:
      summary: Lista salas públicas
      responses:
        '200': { description: Salas cadastradas }
    post:
      summary: Cria uma sala
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Sala criada }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rooms/{roomId}/seats:
    post:
      summary: Gera o mapa de assentos de uma sala
      security: [{ bearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSeats'
      responses:
        '201': { description: Mapa de assentos criado }
        '400': { description: Mapa já existente ou dados inválidos }
  /rooms/{roomId}/seats/{seatId}/availability:
    patch:
      summary: Coloca um assento em manutenção ou o libera para venda
      security: [{ bearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: seatId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isAvailable]
              properties:
                isAvailable: { type: boolean }
      responses:
        '200': { description: Disponibilidade do assento atualizada }
        '400': { description: Assento possui reserva ativa ou ingresso futuro }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sessions/{sessionId}/seats:
    get:
      summary: Exibe o mapa de assentos disponível para uma sessão
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Assentos com status AVAILABLE, HELD, SOLD ou UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /users:
    post:
      summary: Cria uma conta de cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201': { description: Usuário criado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: E-mail já cadastrado }
  /auth/login:
    post:
      summary: Autentica uma pessoa e retorna JWT de uma hora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200': { description: Token e usuário seguro }
        '401': { description: Credenciais inválidas }
  /auth/me:
    get:
      summary: Retorna o perfil do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Perfil seguro }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orders:
    get:
      summary: Lista pedidos do cliente autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pedidos e seus ingressos }
    post:
      summary: Cria uma reserva temporária de assentos por dez minutos
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Pedido pendente criado, com a data de expiração da reserva
        '400': { description: Assentos indisponíveis ou dados inválidos }
  /orders/{orderId}/pay:
    post:
      summary: Confirma o pagamento simulado e emite ingressos
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200': { description: Pedido pago e ingressos emitidos }
        '400': { description: Reserva expirada ou pagamento inválido }
  /orders/{orderId}/cancel:
    post:
      summary: Cancela um pedido até duas horas antes da sessão
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200': { description: Pedido cancelado }
        '400': { description: Cancelamento não permitido }
  /tickets:
    get:
      summary: Lista os ingressos do cliente autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ingressos com sessão, sala, cinema e assento }
  /tickets/{code}/qrcode:
    get:
      summary: Gera o QR Code de um ingresso ativo do proprietário
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: QR Code em data URL }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/cinemas:
    get:
      summary: Lista os cinemas que o administrador pode operar
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cinemas vinculados ao gerente ou todos os cinemas para a plataforma }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/cinemas/{cinemaId}/tickets:
    get:
      summary: Lista ingressos vendidos de um cinema, incluindo comprador e assento
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cinemaId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Ingressos vendidos no cinema autorizado }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/cinemas/{cinemaId}/metrics:
    get:
      summary: Retorna receita, ocupação e sessões futuras de um cinema autorizado
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cinemaId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Métricas operacionais do cinema }
        '403': { $ref: '#/components/responses/Forbidden' }
  /favorites:
    get:
      summary: Lista filmes favoritos do cliente autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Favoritos do usuário }
  /favorites/{movieId}:
    post:
      summary: Adiciona um filme aos favoritos
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '201': { description: Favorito criado }
    delete:
      summary: Remove um filme dos favoritos
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '204': { description: Favorito removido }
  /admin/dashboard:
    get:
      summary: Retorna métricas administrativas da plataforma
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Métricas de catálogo, vendas e ingressos }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cinemas/{cinemaId}/admins:
    post:
      summary: Vincula um usuário como administrador de um cinema
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cinemaId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '201': { description: Vínculo administrativo criado }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tickets/validate:
    post:
      summary: Valida um ingresso ativo e registra seu uso
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: Ingresso validado }
        '400': { description: Ingresso inválido, cancelado ou já utilizado }
        '403': { $ref: '#/components/responses/Forbidden' }
  /movies/{id}/deactivate:
    patch:
      summary: Desativa um filme
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Filme desativado }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rooms/{roomId}/deactivate:
    patch:
      summary: Desativa uma sala
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sala desativada }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sessions/{id}/deactivate:
    patch:
      summary: Desativa uma sessão
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sessão desativada }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sessions/{id}/cancel:
    patch:
      summary: Cancela uma sessão, ingressos e reservas pendentes
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sessão cancelada }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MovieId:
      name: movieId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
    Forbidden:
      description: Papel sem permissão para esta operação
    NotFound:
      description: Recurso não encontrado
    ValidationError:
      description: Dados de entrada inválidos
  schemas:
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    UserRegistration:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, minLength: 8 }
    CreateOrder:
      type: object
      required: [sessionId, tickets]
      properties:
        sessionId: { type: integer, minimum: 1 }
        tickets:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [seatId, type]
            properties:
              seatId: { type: integer, minimum: 1 }
              type: { type: string, enum: [FULL, HALF] }
    CreateSession:
      type: object
      required: [movieId, roomId, startsAt, price]
      properties:
        movieId: { type: integer, minimum: 1 }
        roomId: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        price: { type: number, minimum: 0.01 }
        recurrenceDays:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 6 }
          description: Dias da semana, de 0 (domingo) a 6 (sábado).
        recurrenceUntil:
          type: string
          format: date-time
      description: O término é calculado pela duração cadastrada do filme. recurrenceDays e recurrenceUntil devem ser informados juntos.
    GenerateSeats:
      type: object
      required: [rows, seatsPerRow]
      properties:
        rows: { type: integer, minimum: 1, maximum: 26 }
        seatsPerRow: { type: integer, minimum: 1, maximum: 50 }
        accessibleSeats:
          type: array
          items: { type: string, pattern: '^[A-Z]\\d{2}$' }
        vipSeats:
          type: array
          items: { type: string, pattern: '^[A-Z]\\d{2}$' }
      description: Um assento não pode ser VIP e acessível ao mesmo tempo.
