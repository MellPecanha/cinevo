name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cinevo
          POSTGRES_PASSWORD: cinevo
          POSTGRES_DB: cinevo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinevo -d cinevo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --immutable

      - name: Apply test database contract
        working-directory: backend
        env:
          DATABASE_URL: postgresql://cinevo:cinevo@localhost:5432/cinevo_test
        run: yarn prisma db update

      - name: Check backend types
        working-directory: backend
        run: yarn tsc --noEmit

      - name: Run backend integration tests
        working-directory: backend
        env:
          DATABASE_URL_TEST: postgresql://cinevo:cinevo@localhost:5432/cinevo_test
          JWT_SECRET: cinevo-ci-secret
        run: yarn test

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Build frontend
        working-directory: frontend
        run: yarn build
