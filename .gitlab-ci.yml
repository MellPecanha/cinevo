stages:
  - quality
  - test
  - build
  - deploy

default:
  image: node:24-bookworm
  interruptible: true
  tags:
    - homeserver

variables:
  YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.yarn-cache"

cache:
  key:
    files:
      - backend/yarn.lock
      - frontend/yarn.lock
  paths:
    - .yarn-cache/
  policy: pull-push

.yarn_job:
  before_script:
    - corepack enable

frontend:lint:
  stage: quality
  extends: .yarn_job
  script:
    - cd frontend
    - yarn install --immutable
    - yarn lint

backend:quality:
  stage: quality
  extends: .yarn_job
  script:
    - cd backend
    - yarn install --immutable
    - yarn contract:emit
    - git diff --exit-code -- src/prisma/contract.json src/prisma/contract.d.ts
    - yarn build

backend:integration-tests:
  stage: test
  extends: .yarn_job
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: cinevo_test
    POSTGRES_USER: cinevo
    POSTGRES_PASSWORD: cinevo
    DATABASE_URL: postgresql://cinevo:cinevo@postgres:5432/cinevo_test
    DATABASE_URL_TEST: postgresql://cinevo:cinevo@postgres:5432/cinevo_test
    JWT_SECRET: cinevo-ci-test-secret
  script:
    - cd backend
    - yarn install --immutable
    - DATABASE_URL=postgresql://cinevo:cinevo@postgres:5432/cinevo_test yarn prisma db update
    - DATABASE_URL=postgresql://cinevo:cinevo@postgres:5432/cinevo_test DATABASE_URL_TEST=postgresql://cinevo:cinevo@postgres:5432/cinevo_test JWT_SECRET=cinevo-ci-test-secret yarn test

frontend:build:
  stage: build
  extends: .yarn_job
  script:
    - cd frontend
    - yarn install --immutable
    - yarn build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

deploy:production:
  image: docker:27-cli
  stage: deploy
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker compose -p cinevo -f docker-compose.yml config
    - docker compose -p cinevo -f docker-compose.yml up -d --build --remove-orphans
    - docker compose -p cinevo -f docker-compose.yml ps
    - docker compose -p cinevo -f docker-compose.yml logs api frontend --tail=100
