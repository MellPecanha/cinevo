services:
  postgres:
    image: postgres:17
    container_name: cinevo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinevo
      POSTGRES_PASSWORD: cinevo
      POSTGRES_DB: cinevo
    ports:
      - "5433:5432"
    volumes:
      - cinevo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinevo -d cinevo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: cinevo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cinevo:cinevo@postgres:5432/cinevo
      JWT_SECRET: cinevo-development-secret-change-me
      FRONTEND_ORIGIN: http://localhost:5173
      PORT: 3333
    ports:
      - "3333:3333"

volumes:
  cinevo_postgres_data:
